name: build-push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/build-push.yml'
  schedule:
    - cron: '23 2 * * 1'  # weekly: follow upstream releases

env:
  IMAGE: brycehuang/aio-sandbox

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: build-push
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream version
        id: upstream
        run: |
          VER="$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/agent-infra/sandbox/releases/latest | jq -r '.tag_name' | sed 's/^v//')"
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "::error::failed to resolve upstream release tag"
            exit 1
          fi
          if ! [[ "$VER" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::unexpected upstream tag format: ${VER}"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Upstream aio-sandbox version: ${VER}"

      - name: Compute date tag
        id: date
        run: echo "value=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            BASE_TAG=${{ steps.upstream.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test as uid 6001 (app)
        run: |
          docker run -d --name smoke \
            --user 6001:6001 \
            --security-opt seccomp=unconfined \
            --shm-size=2g \
            -p 8080:8080 \
            ${{ env.IMAGE }}:ci
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 -o /dev/null http://localhost:8080/v1/docs; then
              ok=1
              echo "sandbox ready after ~$((i * 5))s (as uid 6001)"
              docker exec smoke test -w /run/user/6001 || { echo "::error::/run/user/6001 not writable for uid 6001"; exit 1; }
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::smoke test failed: sandbox not ready within 300s as uid 6001"
            docker logs smoke 2>&1 | tail -150
            exit 1
          fi
          browser_ok=0
          for i in $(seq 1 36); do
            if docker exec smoke python3 -c "import urllib.request as u; u.urlopen('http://127.0.0.1:9222/json/version', timeout=3)" 2>/dev/null; then
              browser_ok=1
              echo "browser CDP ready after ~$((i * 5))s"
              break
            fi
            sleep 5
          done
          if [ "$browser_ok" != "1" ]; then
            echo "::error::browser CDP not ready within 180s as uid 6001"
            docker exec smoke sh -c 'tail -80 /var/log/gem/browser-supervisor.log' || true
            docker logs smoke 2>&1 | tail -80
            exit 1
          fi

      - name: Collect failure diagnostics
        if: failure()
        run: |
          set +e
          echo "=== container state ==="
          docker ps -a --filter name=smoke --format '{{.Status}}'
          echo "=== nginx stderr (supervisord nginx-error.log) ==="
          docker exec smoke sh -c 'tail -60 /var/log/gem/nginx-error.log' || true
          echo "=== nginx stdout (nginx-wait.sh loop messages) ==="
          docker exec smoke sh -c 'tail -40 /var/log/gem/nginx-access.log' || true
          echo "=== nginx -t config test ==="
          docker exec smoke /usr/sbin/nginx -t -c /opt/gem/nginx.conf 2>&1 || true
          echo "=== rendered nginx confs ==="
          docker exec smoke sh -c 'echo "--- server-active:"; cat /opt/gem/nginx-server-active.conf; echo "--- proxy-map:"; cat /opt/gem/nginx-proxy-map.conf; echo "--- nginx/ dir:"; ls -la /opt/gem/nginx/' || true
          echo "=== pid/runtime dirs ==="
          docker exec smoke sh -c 'ls -la /var/run/gem/ /var/lib/aio-sandbox/nginx/; id' || true
          echo "=== browser-supervisor log ==="
          docker exec smoke sh -c 'tail -40 /var/log/gem/browser-supervisor.log' || true
          echo "=== CDP probe ==="
          docker exec smoke python3 -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:9222/json/version', timeout=3).status)" || true
          echo "=== listening ports ==="
          docker exec smoke sh -c 'ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || cat /proc/net/tcp' || true
          echo "=== entrypoint env ==="
          docker exec smoke sh -c 'tr "\0" "\n" < /proc/1/environ | grep -E "^(WAIT_|.*PORT|.*LISTEN|USER|HOME|LOG_DIR)" | sort' || true
          echo "=== docker logs (tail) ==="
          docker logs smoke 2>&1 | tail -40 || true

      - name: Push latest + version-date tags
        run: |
          docker tag "$IMAGE:ci" "$IMAGE:latest"
          docker tag "$IMAGE:ci" "$IMAGE:${{ steps.upstream.outputs.version }}-${{ steps.date.outputs.value }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.upstream.outputs.version }}-${{ steps.date.outputs.value }}"
